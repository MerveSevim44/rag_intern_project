name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements.txt'in tamami BILINCLI olarak kurulmuyor: torch==2.11.0 +
      # sentence-transformers CI'da ~2 GB indirme demek ve offline testlerin
      # hicbiri bunlara dokunmuyor. Foundry Local / Ollama gerektiren iki test
      # pytest komutunda --ignore ile haric tutuluyor.
      # Yeni bir test bu listede olmayan bir pakete ihtiyac duyarsa buraya eklenir.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy matplotlib plotly altair streamlit

      - name: Run offline test suite
        run: python -m pytest tests -v --ignore=tests/test_code_interpreter_step2.py --ignore=tests/test_sandbox_and_datasets.py -k "not test_data_engine_end_to_end_visualization"
