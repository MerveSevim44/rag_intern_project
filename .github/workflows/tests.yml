name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements.txt'in tamami BILINCLI olarak kurulmuyor: torch==2.11.0 +
      # sentence-transformers CI'da ~2 GB indirme demek ve offline testlerin
      # hicbiri bunlara dokunmuyor. Foundry Local / Ollama gerektiren iki test
      # `live` marker'i ile zaten haric tutuluyor (bkz. pytest.ini).
      # Yeni bir test bu listede olmayan bir pakete ihtiyac duyarsa buraya eklenir.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy matplotlib plotly altair streamlit

      - name: Run offline test suite
        run: python -m pytest tests -v
